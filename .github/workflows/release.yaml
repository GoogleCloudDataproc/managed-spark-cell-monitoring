name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g. v1.0.1)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish to PyPI via OSS Exit Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.tag || github.ref }}
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "22"
        package-manager-cache: false

    - name: Build AnyWidget frontend static assets
      run: |
        yarn --cwd js install --frozen-lockfile
        yarn --cwd js build

    - name: Setup Java JDK
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: "temurin"
        java-version: "17"

    - name: Setup SBT
      uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14

    - name: Build Scala fat JAR assemblies
      run: |
        cd scala
        sbt assembly
        mkdir -p ../managed_spark_cell_monitoring/static/listeners
        cp spark-3/target/scala-2.12/managed-spark-cell-monitoring-spark3-assembly-*.jar ../managed_spark_cell_monitoring/static/listeners/
        cp spark-4/target/scala-2.13/managed-spark-cell-monitoring-spark4-assembly-*.jar ../managed_spark_cell_monitoring/static/listeners/

    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: false

    - name: Install build and upload dependencies
      run: uv pip install --system build keyring twine keyrings.google-artifactregistry-auth

    - name: Build and verify package
      run: |
        rm -rf build dist
        python3 -m build
        twine check --strict dist/*
        uv venv /tmp/release_test_venv
        uv pip install --python /tmp/release_test_venv/bin/python dist/*.whl
        /tmp/release_test_venv/bin/python -c "import pathlib, managed_spark_cell_monitoring as m; p3 = pathlib.Path(m.get_jar_path('3')); p4 = pathlib.Path(m.get_jar_path('4')); assert p3.is_file() and p4.is_file(); static = pathlib.Path(m.__file__).parent / 'static'; assert (static / 'widget.js').is_file() and (static / 'widget.css').is_file(); print('Verified package:', m.__version__, p3.name, p4.name)"

    - name: Authenticate to OSS Exit Gate
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        workload_identity_provider: "projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github"

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

    - name: Clean up existing artifacts in Artifact Registry
      run: |
        gcloud artifacts packages delete managed-spark-cell-monitoring \
          --project=oss-exit-gate-prod \
          --repository=spark-cell-monitoring--pypi \
          --location=us \
          --quiet || true

    - name: Upload package to Artifact Registry
      run: |
        twine upload \
          --repository-url https://us-python.pkg.dev/oss-exit-gate-prod/spark-cell-monitoring--pypi \
          dist/*

    - name: Trigger OSS Exit Gate release
      run: |
        echo '{"publish_all": true}' > publish_all.json
        gcloud storage cp publish_all.json \
          gs://oss-exit-gate-prod-projects-bucket/spark-cell-monitoring/pypi/manifests/publish_all.json
