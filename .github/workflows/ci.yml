name: CI

on:
  push:
    branches: [ "main", "pr*" ]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'
          cache-dependency-path: './js/yarn.lock'

      - name: Install dependencies
        run: yarn --cwd js install --frozen-lockfile

      - name: Lint frontend code
        run: yarn --cwd js lint

      - name: Run Jest test suite
        run: yarn --cwd js test --coverage

      - name: Build AnyWidget static assets
        run: yarn --cwd js build

      - name: Upload frontend static bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static-bundle
          path: |
            managed_spark_cell_monitoring/static/widget.js
            managed_spark_cell_monitoring/static/widget.css
            managed_spark_cell_monitoring/static/widget.js.map
            managed_spark_cell_monitoring/static/widget.css.map

  scala:
    name: Scala Listener Test & Assembly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'sbt'

      - name: Run Scala unit tests
        run: |
          cd scala
          sbt test

      - name: Build Scala fat JAR assemblies
        run: |
          cd scala
          sbt assembly

      - name: Upload listener fat JARs
        uses: actions/upload-artifact@v4
        with:
          name: scala-listener-jars
          path: managed_spark_cell_monitoring/static/listeners/*.jar

  python:
    name: Python Test & Wheel Validation (${{ matrix.python-version }})
    needs: [frontend, scala]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Download frontend static bundle
        uses: actions/download-artifact@v4
        with:
          name: frontend-static-bundle
          path: managed_spark_cell_monitoring/static/

      - name: Download scala listener fat JARs
        uses: actions/download-artifact@v4
        with:
          name: scala-listener-jars
          path: managed_spark_cell_monitoring/static/listeners/

      - name: Install packaging tools
        run: pip install --upgrade pip build twine

      - name: Install package in editable mode
        run: pip install -e ".[test]"

      - name: Run Python unit tests
        run: pytest tests/

      - name: Build distribution packages (.whl and .tar.gz)
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Verify clean wheel installation and CLI discovery
        run: |
          python -m venv test_venv
          ./test_venv/bin/pip install dist/*.whl
          ./test_venv/bin/python -m managed_spark_cell_monitoring 3
          ./test_venv/bin/python -m managed_spark_cell_monitoring 4
