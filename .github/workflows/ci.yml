name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: './js/yarn.lock'

      - name: Install dependencies
        run: yarn --cwd js install --frozen-lockfile

      - name: Lint frontend code
        run: yarn --cwd js lint

      - name: Run Jest test suite
        run: yarn --cwd js test --coverage

      - name: Build AnyWidget static assets
        run: yarn --cwd js build

      - name: Upload frontend static bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-static-bundle
          path: |
            managed_spark_cell_monitoring/static/widget.js
            managed_spark_cell_monitoring/static/widget.css
            managed_spark_cell_monitoring/static/widget.js.map
            managed_spark_cell_monitoring/static/widget.css.map

  scala:
    name: Scala Listener Test & Assembly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'sbt'

      - name: Setup SBT
        uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14

      - name: Run Scala unit tests
        run: |
          cd scala
          sbt test

      - name: Build Scala fat JAR assemblies
        run: |
          cd scala
          sbt assembly
          mkdir -p ../managed_spark_cell_monitoring/static/listeners
          cp spark-3/target/scala-2.12/managed-spark-cell-monitoring-spark3-assembly-*.jar ../managed_spark_cell_monitoring/static/listeners/
          cp spark-4/target/scala-2.13/managed-spark-cell-monitoring-spark4-assembly-*.jar ../managed_spark_cell_monitoring/static/listeners/

      - name: Upload listener fat JARs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scala-listener-jars
          path: managed_spark_cell_monitoring/static/listeners/*.jar

  python:
    name: Python Test & Wheel Validation (${{ matrix.python-version }})
    needs: [frontend, scala]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches requires-python (>=3.10) in pyproject.toml and covers all
        # Dataproc / Serverless Spark 2.2+ runtimes (2.2/2.3 = 3.11-3.12,
        # 3.0 = 3.12, 4.0 = 3.13) plus local client versions. The unit suite
        # runs in ~1s, so every Python version runs the full test suite on
        # ubuntu-latest, while wheel build and clean-venv JAR discovery run on
        # the default Managed Spark runtime Python version (3.12).
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Download frontend static bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-static-bundle
          path: managed_spark_cell_monitoring/static/

      - name: Download scala listener fat JARs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scala-listener-jars
          path: managed_spark_cell_monitoring/static/listeners/

      - name: Install package in editable mode
        run: uv pip install --system -e ".[test]"

      - name: Run Python unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Build and validate distribution packages (.whl and .tar.gz)
        if: matrix.python-version == '3.12'
        run: |
          uv pip install --system build twine
          python -m build
          twine check --strict dist/*
          uv venv test_venv
          uv pip install --python ./test_venv/bin/python dist/*.whl
          ./test_venv/bin/python -c "import managed_spark_cell_monitoring as m; print(m.get_jar_path('3')); print(m.get_jar_path('4'))"
