[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "managed-spark-cell-monitoring"
version = "1.0.0"
description = "Real-time cell monitoring and event visualization for Apache Spark in Jupyter notebooks."
readme = "README.md"
license = "Apache-2.0"
# The floor matches google-cloud-spark-connect (>=3.10) and covers all
# Dataproc / Serverless Spark 2.2+ runtimes (2.2/2.3 = 3.11-3.12, 3.0 = 3.12,
# 4.0 = 3.13). When changing the floor, also update .github/workflows/vermin.yaml
# and the matrix in .github/workflows/ci.yml.
requires-python = ">=3.10"
authors = [
    { name = "Google LLC" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: IPython",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "ipywidgets>=8.0.0,<9.0.0",
    "anywidget>=0.9.0,<0.10.0",
    "ipython>=7.0.0",
    "ipykernel>=5.0.0",
    "traitlets>=5.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[tool.hatch.build.targets.wheel]
ignore-vcs = true
packages = ["managed_spark_cell_monitoring"]
artifacts = [
    "managed_spark_cell_monitoring/static/*",
    "managed_spark_cell_monitoring/static/**/*",
]
exclude = [
    "**/*.map",
]

[tool.hatch.build.targets.sdist]
ignore-vcs = true
include = [
    "/managed_spark_cell_monitoring",
    "/js",
    "/scala",
    "README.md",
    "LICENSE",
]
artifacts = [
    "managed_spark_cell_monitoring/static/**",
]
